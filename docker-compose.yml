services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tradeoff
      POSTGRES_PASSWORD: tradeoff
      POSTGRES_DB: tradeoff
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeoff"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://tradeoff:tradeoff@db:5432/tradeoff
      APP_ENV: ${APP_ENV:-dev}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-change-me}
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  pgdata:
