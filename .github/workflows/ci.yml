name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradeoff
          POSTGRES_PASSWORD: tradeoff
          POSTGRES_DB: tradeoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeoff"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://tradeoff:tradeoff@localhost:5432/tradeoff_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Contracts are up to date
        run: |
          uv run python -m app.contracts
          git diff --exit-code ../contracts/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/
      - run: npm test
      - run: npm run build
